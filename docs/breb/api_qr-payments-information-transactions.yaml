definitions:
  infoRequest:
    type: object
    required:
      - date
    properties:
      trackingNumber:
        type: string
        maxLength: 50
        example: NEQUI1234
        pattern: ^[^~^&"%_?<>{}\[\]\\:@/]*$
      reference:
        type: string
        maxLength: 150
        example: Apto - 1936
        pattern: ^[^~^&"%_?<>{}\[\]\\:@/]*$
      date:
        type: string
        example: '2014-03-27'
        maxLength: 19
        pattern: '[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[1-2][0-9]|3[0-1])$'
  retrieveDetailsRequest:
    type: object
    required:
      - data
    properties:
      data:
        type: object
        properties:
          requestInfo:
            $ref: '#/definitions/infoRequest'
  retrieveDetailsResponse:
    type: object
    required:
      - meta
      - data
    properties:
      meta:
        $ref: '#/definitions/meta'
      data:
        type: object
        properties:
          infoResponse:
            $ref: '#/definitions/infoResponse'
  infoResponse:
    type: object
    required:
      - transactionDateTime
      - transactionValue
      - destinationAccountNumber
      - origenIdentificationType
      - origenIdentificationNumber
      - origenAccountNumber
      - transactionStatus
      - responseCode
      - qrId
    properties:
      commerceName:
        type: string
        description: Nombre del comercio
        minLength: 1
        maxLength: 60
        example: Don papas
      transactionDateTime:
        type: string
        format: date-time
        description: Hora y fecha de la transaccion
        pattern: >-
          ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):([0-5]\d):([0-5]\d)(.\d{2}([0-9]))?Z$
        example: '2023-07-20T11:30:00Z'
      transactionValue:
        type: number
        format: double
        maximum: 999999999999.99
        description: Valor de la transaccion
        example: 3000
      transactionComision:
        type: number
        format: double
        maximum: 9999999999.99
        description: Comision de la transaccion
        example: 123.12
      transactionIva:
        type: number
        format: double
        maximum: 9999999999.9
        description: IVA de la transaccion
        example: 1.9
      transactionPayerCost:
        type: number
        format: double
        maximum: 9999999999.9
        description: Costo pagado por la transaccion
        example: 500
      trackingNumber:
        type: string
        description: Código de la identificacion de la transaccion
        minLength: 1
        maxLength: 50
        example: QR911879545
      externalReference:
        type: string
        description: Referencia externa
        minLength: 1
        maxLength: 150
        example: Apto - 1936
      destinationIdentificationType:
        type: string
        enum:
          - CD
          - CC
          - CE
          - NIT
          - TI
          - PASS
          - EXTPNNRC
          - EXTPJNRC
          - FIDE
          - RC
        description: Tipo de documento de identificacion del titular cuenta destino
        minLength: 1
        maxLength: 20
        example: CC
      destinationIdentificationNumber:
        type: string
        description: Numero de documento de identificacion del titular cuenta destino
        minLength: 1
        maxLength: 20
        example: '123455678'
      destinationAccountType:
        type: string
        enum:
          - D
          - S
        description: Tipo de la cuenta de la cuenta destino
        minLength: 1
        maxLength: 10
        example: D
      destinationAccountNumber:
        type: string
        description: Numero de cuenta, de la cuenta destino
        minLength: 1
        maxLength: 16
        example: '129125494'
      destinationAccountName:
        type: string
        description: Nombre del titular de la cuenta destino
        minLength: 1
        maxLength: 60
        example: Pedro Perez
      origenIdentificationType:
        type: string
        enum:
          - CD
          - CC
          - CE
          - NIT
          - TI
          - PASS
          - EXTPNNRC
          - EXTPJNRC
          - FIDE
          - RC
        description: Tipo de documento de identificacion del titular cuenta origen
        minLength: 1
        maxLength: 20
        example: CC
      origenIdentificationNumber:
        type: string
        description: Numero de documento de identificacion del titular cuenta origen
        minLength: 1
        maxLength: 20
        example: '523455672'
      origenAccountType:
        type: string
        enum:
          - D
          - S
        description: Tipo de cuenta de la cuenta origen
        minLength: 1
        maxLength: 20
        example: Cuenta de Ahorros
      origenAccountNumber:
        type: string
        description: Numero de cuenta, de la cuenta origen
        minLength: 1
        maxLength: 15
        example: '12345678912'
      transactionStatus:
        type: string
        description: Estado de la transaccion
        minLength: 1
        maxLength: 20
        example: annulled
      stateReason:
        type: string
        description: Motivo del estado
        minLength: 1
        maxLength: 20
        example: Desistio de compra
      responseCode:
        type: string
        description: Codigo de respuesta
        minLength: 1
        maxLength: 20
        example: Exitoso
      depositStatus:
        type: string
        description: Estado del deposito
        minLength: 1
        maxLength: 20
        example: Exitoso
      origenClientName:
        type: string
        description: Nombre del cliente origen
        minLength: 1
        maxLength: 60
        example: Jose Ramirez
      qrPointOfSale:
        type: string
        description: Punto de venta del QR
        minLength: 1
        maxLength: 60
        example: Piso 4 Puesto 15
      qrCashRegister:
        type: string
        description: Caja registradora
        minLength: 1
        maxLength: 20
        example: Caja 4
      toPlan:
        type: string
        description: Plan
        minLength: 1
        maxLength: 20
        example: Plan Avanzado
      toModel:
        type: string
        description: Modelo
        minLength: 1
        maxLength: 20
        example: Modelo QR Mixto
      transactionReference:
        type: string
        description: referencia de la transaccion
        minLength: 1
        maxLength: 150
        example: QR - Don papas
      contactEmailOne:
        type: string
        description: Contacto de email 1
        minLength: 1
        maxLength: 60
        example: sede1donpp@gmail.com
      notificationSentEmailOne:
        type: boolean
        description: Indicador enviar notificaciones al email 1
        example: true
      contactPhoneOne:
        type: string
        description: Contacto de celular 1
        minLength: 1
        maxLength: 20
        example: '3117000222'
      notificationSentPhoneOne:
        type: boolean
        description: Indicador enviar notificaciones al celuar 1
        example: true
      contactEmailTwo:
        type: string
        description: Contacto de email 2
        minLength: 1
        maxLength: 60
        example: sede2donpp@gmail.com
      notificationSentEmailTwo:
        type: boolean
        description: Indicador enviar notificaciones al email 2
        example: true
      contactPhoneTwo:
        type: string
        description: Contacto de celular 2
        minLength: 1
        maxLength: 60
        example: '3117000223'
      notificationSentPhoneTwo:
        type: boolean
        description: Indicador enviar notificaciones al celuar 2
        example: true
      contactEmailThree:
        type: string
        description: Contacto de email 3
        minLength: 1
        maxLength: 60
        example: sede3donpp@gmail.com
      notificationSentEmailThree:
        type: boolean
        description: Indicador enviar notificaciones al email 3
        example: true
      contactPhoneThree:
        type: string
        description: Contacto de celular 3
        minLength: 1
        maxLength: 60
        example: '3117000224'
      notificationSentPhoneThree:
        type: boolean
        description: Indicador enviar notificaciones al celuar 3
        example: true
      versionQr:
        type: string
        description: Version del codigo QR
        minLength: 1
        maxLength: 20
        example: V2.0
      qrId:
        type: string
        description: Identificador del QR
        minLength: 1
        maxLength: 50
        example: 31e5bcea-5edb-4b07-b781-37abb68c1f3b
      qrType:
        type: string
        description: Tipo de QR
        minLength: 1
        maxLength: 20
        example: masivo
      createdAt:
        type: string
        format: date-time
        description: Fecha y hora de creacion del QR
        pattern: >-
          ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])T([01]\d|2[0-3]):([0-5]\d):([0-5]\d)(.\d{2}([0-9]))?Z$
        example: '2023-07-20T11:30:00Z'
      notificationSentCommerce:
        type: boolean
        description: Indicador de envio de notificaciones al comercio
        example: true
      notificationSentPayer:
        type: boolean
        description: Indicador de envio de notificaciones al pagador
        example: true
      responseCodeAnnul:
        type: string
        description: Código de respuesta de anulacion
        minLength: 1
        maxLength: 20
        example: masivo
      stateReasonAnnul:
        type: string
        description: Motivo de la anulacion
        minLength: 1
        maxLength: 20
        example: Exitoso
      trackingNumberAnnul:
        type: string
        description: Número de seguimiento de la anulacion
        minLength: 1
        maxLength: 60
        example: RTT537962157
      qrSeller:
        type: string
        description: Asesor de QR
        minLength: 1
        maxLength: 20
        example: Alejandra Hernandez
  meta:
    description: Datos de trazabilidad e informacion técnica del mensaje.
    type: object
    required:
      - _messageId
      - _requestDateTime
      - _applicationId
    properties:
      _messageId:
        type: string
        example: c4e6bd04-5149-11e7-b114-b2f933d5fe66
      _requestDateTime:
        type: string
        format: date-time
        example: '2016-06-23T09:07:21.205-07:00'
      _applicationId:
        type: string
        example: acxff62e-6f12-42de-9012-3e7304418abd
  failure:
    type: object
    description: Mensaje de respuesta cuando ocurre un error.
    required:
      - meta
      - errors
    properties:
      meta:
        $ref: '#/definitions/meta'
      status:
        type: number
        description: >-
          Codigo de estado HTTP (status code) asociado al mensaje de error de la
          respuesta del llamado a la API.
        example: 404
      title:
        type: string
        description: >-
          Titulo asociado al codigo de estado HTTP (status code) asociado al
          mensaje de error de la respuesta del llamado a la API.
        example: Not Found
      errors:
        type: array
        description: Lista de errores detectados
        items:
          $ref: '#/definitions/error'
  error:
    type: object
    required:
      - code
      - detail
    properties:
      code:
        description: An application-specific error code, expressed as a string value.
        type: string
        example: BP404
      detail:
        description: >-
          A human-readable explanation specific to this occurrence of the
          problem.
        type: string
        example: Requested resource could not be found

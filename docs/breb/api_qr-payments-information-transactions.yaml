swagger: '2.0'
info:
  title: QR Payments Information - Transactions
  version: 1.0.2
  description: >-
    Esta operación permite ejecutar la transacción de transferencia por medio de
    un código QR
  x-ibm-name: qr-payments-information-transactions
basePath: >-
  /v1/sales-service/servicing/payment-initiation/qr-payments-information/transactions
paths:
  /retrieve-details:
    post:
      operationId: retrieveDetails
      x-api-type: traditional
      summary: >-
        Permite consultar informacion detallada de las transacciones realizadas
        con codigos QR
      description: >-
        ### Clasificación de la información: Público

        Capacidad orientada a consultar informacion detallada de la transaccion
        que se llevo a cabo durante un proceso de pago con códigos QR,
        permitiendole a los comercios conocer las transacciones realizadas por
        los diferentes usuarios.
      parameters:
        - name: client-id
          required: true
          description: Credencial client id
          in: header
          type: string
        - name: client-secret
          required: true
          description: Credencial client secret
          in: header
          type: string
        - name: accept
          in: header
          required: true
          type: string
          description: >-
            application/vnd.bancolombia.v4+json, el cual representa el formato
            de mensajería.
        - name: message-id
          in: header
          required: true
          type: string
          pattern: >-
            ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
          description: >-
            Identificador de transacción. Se recomienda usar un UUID para el
            valor de este campo Ejemplo: c4e6bd04-5149-11e7-b114-b2f933d5fe66.
        - in: body
          name: body
          description: Informacion para realizar la peticion del estado de la transaccion
          required: true
          schema:
            $ref: '#/definitions/retrieveDetailsRequest'
      responses:
        '200':
          x-success-response: Successfull
          schema:
            $ref: '#/definitions/retrieveDetailsResponse'
          description: Respuesta exitosa
          x-ibm-languages:
            description:
              en: Successful response.
          headers:
            Content-Type:
              type: string
              description: >-
                Formato de mensajeria de la API. Ejemplo:
                application/vnd.bancolombia.v4+json.
              x-ibm-languages:
                description:
                  en: >-
                    API message format. Example:
                    application/vnd.bancolombia.v4+json.
            API-Version:
              type: string
              description: 'Version de la API. Ejemplo: 1.0.1.'
              x-ibm-languages:
                description:
                  en: 'API Version. Example: 1.0.1.'
            RateLimit-Limit:
              type: number
              description: Limite de solicitudes por intervalo de tiempo
              x-ibm-languages:
                description:
                  en: Resquest limit per time interval.
            message-id:
              type: string
              description: >-
                Identificador del mensaje o de correlacion usado para la
                trazabilidad de los llamados a las APIs.
              x-ibm-languages:
                description:
                  en: >-
                    Message identifier or correlation identifier used for the
                    traceability of the API calls.
        '400':
          $ref: '#/responses/400'
        '401':
          $ref: '#/responses/401'
        '404':
          $ref: '#/responses/404'
        '500':
          $ref: '#/responses/500'
        '502':
          $ref: '#/responses/502'
        '503':
          $ref: '#/responses/503'
        '504':
          $ref: '#/responses/504'
      security:
        - clientSecret: []
          clientId: []
      tags:
        - Transactions
  /health:
    head:
      operationId: healthOperation
      summary: Permite consultar el estado de la aplicacion para la analitica.
      description: '### Analitica del API, permite consultar el estado de la aplicacion.'
      responses:
        '200':
          description: Respuesta exitosa.
          x-ibm-languages:
            description:
              en: Successful response.
      security:
        - clientId: []
          clientSecret: []
      tags:
        - Monitoring
